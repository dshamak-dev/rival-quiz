<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOT Manager</title>
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">
	  <link rel="stylesheet" href="./index.css">
  </head>
  <body>
    <main>
      <div id="loader">
        <h2>Loading..</h2>
      </div>
      
      <div id="message">
        <div class="list" id="bot-list"></div>
        <h2>Bot Message Manager</h1>
        <form id="message-form">
          <div class="columns-2">
            <div class="form-group">
              <label for="bot_token">Telegram Bot:</label>
              <select id="bot_token" disabled name="token"></select>
            </div>
            <div class="form-group">
              <label for="chat_id">Chat:</label>
              <select id="chat_id" disabled name="id"></select>
            </div>
          </div>
          <div class="columns-2">
            <div class="form-group">
              <label for="markup">Markup Type:</label>
              <select type="text" id="markup" name="markup"></select>
            </div>
            <div></div>
          </div>
          <div class="form-group">
            <label for="message">Message:</label>
            <textarea id="message" name="message" rows="5" required></textarea>
          </div>
          <div class="form-group">
            <button type="submit">Send Bot Message</button>
          </div>
        </form>
      </div>
    </main>
    <script defer src="./index.js"></script>
  </body>
</html>
