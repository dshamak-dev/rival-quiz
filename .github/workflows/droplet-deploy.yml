name: Deploy to Droplet
on:
  workflow_run:
    workflows: ["Build And Push"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      root_directory:
        description: "Directory where docker-compose.yml is located"
        required: true
        default: "/root"

jobs:
  deploy-to-droplet:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'  # Run only if previous workflow was successful
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install SSH client
        run: sudo apt-get install -y openssh-client

      - name: Define ROOT_DIRECTORY
        run: echo "ROOT_DIRECTORY=${{ github.event.inputs.root_directory || '/root' }}" >> $GITHUB_ENV

      - name: Read version from package.json
        run: echo "PACKAGE_VERSION=$(node -p "require('./package.json').version")" >> $GITHUB_ENV

      - name: Append package version and timestamp to .env
        run: echo "BUILD_NUMBER=$(jq -r .version package.json)#$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> .env

      - name: Delete existing docker-compose.yml on the server (if exists)
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_SSH_HOST }}
          username: ${{ secrets.DROPLET_SSH_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          port: ${{ secrets.DROPLET_SSH_PORT }}
          script: |
            ROOT_DIRECTORY="${{ env.ROOT_DIRECTORY }}" 
            if [ -f "$ROOT_DIRECTORY/.env" ]; then
              echo "Deleting existing .env file..."
              rm -f "$ROOT_DIRECTORY/.env"
            fi

            if [ -f "$ROOT_DIRECTORY/docker-compose.yml" ]; then
              echo "Deleting existing docker-compose.yml..."
              rm -f "$ROOT_DIRECTORY/docker-compose.yml"
            fi

      - name: Copy docker-compose.yml to the droplet
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_SSH_HOST }}
          username: ${{ secrets.DROPLET_SSH_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          port: ${{ secrets.DROPLET_SSH_PORT }}
          source: ./docker-compose.yml
          target: ${{ env.ROOT_DIRECTORY }}
      

      - name: Copy ssl to the droplet
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_SSH_HOST }}
          username: ${{ secrets.DROPLET_SSH_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          port: ${{ secrets.DROPLET_SSH_PORT }}
          source: ./ssl
          target: ${{ env.ROOT_DIRECTORY }}
      
      - name: Copy nginx.conf to the droplet
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_SSH_HOST }}
          username: ${{ secrets.DROPLET_SSH_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          port: ${{ secrets.DROPLET_SSH_PORT }}
          source: ./nginx.conf
          target: ${{ env.ROOT_DIRECTORY }}

      - name: SSH into Droplet, pull image, and run container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_SSH_HOST }}
          username: ${{ secrets.DROPLET_SSH_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          script: |
            ROOT_DIRECTORY="${{ env.ROOT_DIRECTORY }}"
            # Navigate to the root directory
            cd $ROOT_DIRECTORY || { echo "Error: Directory $ROOT_DIRECTORY does not exist"; exit 1; }

            # Split input into lines and write to .env file
            echo "Creating .env file..."
            echo "${{ secrets.ENV_VARS }}" | tr ';' '\n' > .env
            echo "BUILD=$BUILD_NUMBER" >> .env

            # Confirm the contents of the .env file
            echo "Generated .env file contents:"
            cat .env

            # Check if docker-compose.yml exists
            if [ ! -f "docker-compose.yml" ]; then
              echo "Error: docker-compose.yml not found in directory $ROOT_DIRECTORY}" >&2
              exit 1
            fi
            # Pull Database
            # docker pull ${{ secrets.DOCKERHUB_DB_REPO }}
            # docker stop quizlo-db || true
            # docker rm quizlo-db || true
            # Pull Server
            docker pull ${{ secrets.DOCKERHUB_SERVER_REPO }}
            docker stop quizlo-server || true
            docker rm quizlo-server || true
            # Pull Web
            docker pull ${{ secrets.DOCKERHUB_WEB_REPO }}
            docker stop quizlo-web || true
            docker rm quizlo-web || true
            # Run containers
            docker compose down || true
            docker compose --env-file .env up -d

  clear-old-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        if: success() # Runs only if the workflow succeeds
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          workflow: ${{ github.workflow }} # Uses the current workflow
          retain_days: 0 # Delete all previous runs
          keep_minimum_runs: 2 # Keep at least 2 latest runs
