name: Deploy to Droplet
on:
  # workflow_run:
  #   workflows:
  #     - Build And Push Docker Image
  #   types:
  #     - completed
  workflow_dispatch:
    inputs:
      docker_compose_directory:
        description: "Directory where docker-compose.yml is located"
        required: true
        default: "/"

jobs:
  deploy-to-droplet:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install SSH client
        run: sudo apt-get install -y openssh-client

      - name: Copy docker-compose.yml to the server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DROPLET_SSH_HOST }}
          username: ${{ secrets.DROPLET_SSH_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          port: ${{ secrets.DROPLET_SSH_PORT }}
          source: ./docker-compose.yml
          target: ${{ github.event.inputs.docker_compose_directory }}/docker-compose.yml

      - name: SSH into Droplet, pull image, and run container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_SSH_HOST }}
          username: ${{ secrets.DROPLET_SSH_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT }}
          passphrase: ${{ secrets.DROPLET_SSH_PASSPHRASE }}
          script: |
            # Navigate to the directory containing docker-compose.yml
            cd ${{ github.event.inputs.docker_compose_directory }} || { echo "Error: Directory ${{ github.event.inputs.docker_compose_directory }} does not exist"; exit 1; }

            # Check if docker-compose.yml exists
            if [ ! -f "docker-compose.yml" ]; then
              echo "Error: docker-compose.yml not found in directory ${{ github.event.inputs.docker_compose_directory }}" >&2
              exit 1
            fi

            docker pull ${{ secrets.DOCKERHUB_SERVER_REPO }}
            docker stop quizlo-server || true
            docker rm quizlo-server || true
            docker pull ${{ secrets.DOCKERHUB_WEB_REPO }}
            docker stop quizlo-web || true
            docker rm quizlo-web || true
            docker compose down || true
            docker compose up -d || exit 1
