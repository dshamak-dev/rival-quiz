name: Build And Push
on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Create a .env for build
        run: |
          echo "${{ secrets.ENV_VARS }}" | tr ';' '\n' > .env

      - name: Build and Push Docker Images
        run: |
          cat .env
          docker compose --env-file .env build
          docker compose --env-file .env push
        env:
          DOCKER_BUILDKIT: 1
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

  clear-old-builds:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old workflow runs
        if: success() # Runs only if the workflow succeeds
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          workflow: ${{ github.workflow }} # Uses the current workflow
          retain_days: 0 # Delete all previous runs
          keep_minimum_runs: 2 # Keep at least 2 latest runs
