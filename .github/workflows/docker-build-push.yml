name: Build and Push Docker Image
on:
  push:
    branches:
      - monorepo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and Push Docker Images
        run: |
          docker compose build
          docker compose push
        env:
          DOCKER_BUILDKIT: 1

      # - name: Build and Push Docker Image
      #   uses: docker/compose-build-push-action@v2
      #   run: |
      #     docker compose build -t ${{ secrets.DOCKERHUB_REPO }} .
      #     docker push ${{ secrets.DOCKERHUB_REPO }}

  deploy-to-droplet:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install SSH client
        run: sudo apt-get install -y openssh-client

      - name: SSH into Droplet, pull image, and run container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DROPLET_SSH_HOST }}
          username: ${{ secrets.DROPLET_SSH_USERNAME }}
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          port: ${{ secrets.DROPLET_SSH_PORT }}
          script: |
            docker pull ${{ secrets.DOCKERHUB_SERVER_REPO }}
            docker stop server || true
            docker rm server || true
            docker run -d --name server --network host -p 8081:8080 --env-file /root/.env ${{ secrets.DOCKERHUB_SERVER_REPO }}